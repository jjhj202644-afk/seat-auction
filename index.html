<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학급 자리 경매</title>
<meta name="description" content="학급 화폐로 자리를 경매하고 임대까지 정하는 수업 도구">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232347d6'/%3E%3Crect x='14' y='18' width='16' height='12' rx='3' fill='%23fff'/%3E%3Crect x='34' y='18' width='16' height='12' rx='3' fill='%23fff'/%3E%3Crect x='14' y='34' width='16' height='12' rx='3' fill='%23fff'/%3E%3Crect x='34' y='34' width='16' height='12' rx='3' fill='%23ffc83d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/teacher.js"></script>
<script src="js/student.js"></script>
<script>
(function () {
  var SA = window.SA, app = document.getElementById("app");
  var demo = /[?&]demo=1\b/.test(location.search);
  if (!demo) {
    new SA.TeacherApp(app, new SA.SupabaseBackend(window.SA_CONFIG || {}), {}).boot();
    return;
  }
  document.title = "자리 경매 · 체험";
  app.innerHTML =
    '<div class="demo-wrap"><div class="demo-tv" id="tv"></div>' +
    '<div class="demo-side"><div class="demo-side-head"><span>학생 화면 · 26번</span>' +
    '<a href="./" style="color:#fff;opacity:.8;font-weight:700">체험 끝내기</a></div>' +
    '<div class="demo-phone" id="phone"><div class="st-wait"><div class="st-mid">방을 만드는 중…</div></div></div></div></div>';
  var be = new SA.DemoBackend();
  var tv = new SA.TeacherApp(document.getElementById("tv"), be, {
    demo: true,
    onRoom: function (code) {
      new SA.StudentApp(document.getElementById("phone"), be,
        { demo: true, code: code, presetNo: 26, presetNick: "나", presetAssets: 500 }).boot();
    }
  });
  tv.boot();
})();
</script>
</body>
</html>
